# Root Cargo workspace manifest for Proximity Forests.

[workspace]
members = [
    "crates/proximity-forests-core",
    "crates/proximity-forests-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
needless_collect = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
strip = "none"

[profile.bench]
inherits = "release"
debug = 1
