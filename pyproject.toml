[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "proximity-forests"
version = "0.1.0"
description = "High-performance proximity forests for classification, regression, isolation, geometry, and imputation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "scipy>=1.10",
]

[tool.maturin]
manifest-path = "crates/proximity-forests-python/Cargo.toml"
python-source = "python"
module-name = "proximity_forests._core"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"
