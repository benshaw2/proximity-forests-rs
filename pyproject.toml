[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "proximity-forests"
version = "0.1.0a2"
description = "Proximity forest models for classification, regression, and isolation"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["machine-learning", "time-series", "proximity-forest", "rust"]
dependencies = [
    "numpy>=1.23",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "scipy>=1.10",
]
dev = [
    "maturin>=1.9,<2.0",
    "pytest>=8",
    "scipy>=1.10",
    "jupyterlab",
    "ipykernel",
    "pandas",
    "scikit-learn",
    "aeon",
]

[tool.maturin]
manifest-path = "crates/proximity-forests-python/Cargo.toml"
python-source = "python"
module-name = "proximity_forests._core"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"
