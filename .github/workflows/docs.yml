name: Documentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "python/proximity_forests/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "python/proximity_forests/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python runtime and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23" -r docs/requirements.txt
      - name: Build and install the native package for autodoc
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          rust-toolchain: "1.85.0"
          args: --release --locked
          cache: sccache
      - name: Verify documentation import target
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import proximity_forests as pf;
          print(pf.__version__, pf.runtime_info(), pf.__file__)"
      - name: Audit documentation sources
        run: |
          python scripts/check_docs_scaffold.py
          python scripts/audit_documentation.py
      - name: Build strict Sphinx documentation
        run: >-
          python -m sphinx
          -E
          -W
          --keep-going
          -b html
          docs
          docs/_build/html
      - name: Upload documentation build for inspection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
