name: Build release distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python.version }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.10"
            tag: "310"
          - version: "3.11"
            tag: "311"
          - version: "3.12"
            tag: "312"
          - version: "3.13"
            tag: "313"
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            linux: true
            macos_target: ""
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            linux: true
            macos_target: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            linux: false
            macos_target: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            linux: false
            macos_target: "10.12"
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            linux: false
            macos_target: "11.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.macos_target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.version }}
      - name: Build wheel with Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          rust-toolchain: "1.85.0"
          args: >-
            --release
            --locked
            --out dist
            --interpreter ${{ matrix.platform.linux && format('/opt/python/cp{0}-cp{0}/bin/python', matrix.python.tag) || 'python' }}
            --compatibility pypi
          cache: sccache
      - name: Install wheel in selected interpreter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23" pytest
          python -m pip install --no-index --no-deps --force-reinstall --find-links dist proximity-forests
      - name: Test installed wheel outside source tree
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest
          ${{ github.workspace }}/python/tests/test_smoke.py
          ${{ github.workspace }}/python/tests/test_package_metadata.py
          ${{ github.workspace }}/python/tests/test_missing_capability_boundary.py
      - name: Installed-wheel smoke prediction
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import numpy as np; import proximity_forests as pf;
          X=np.array([[0.,1.],[0.1,1.1],[4.,5.],[4.1,5.1]],dtype=np.float32);
          y=np.array([0,0,1,1]);
          m=pf.ProximityForestClassifier(n_estimators=3,sampling='full',random_state=7).fit(X,y);
          assert m.predict(X).shape==(4,);
          print(pf.__version__, pf.runtime_info(), pf.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}-python-${{ matrix.python.version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          rust-toolchain: "1.85.0"
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  verify-distributions:
    name: Verify complete distribution set
    needs:
      - wheels
      - sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download every wheel
        uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: source-distribution
          path: dist
      - name: Verify count, uniqueness, version, and package metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install packaging twine
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          import tomllib
          from packaging.version import Version

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          expected_wheels = 5 * 4
          if len(wheels) != expected_wheels:
              raise SystemExit(
                  f"expected {expected_wheels} wheels, found {len(wheels)}: "
                  + ", ".join(path.name for path in wheels)
              )
          if len(sdists) != 1:
              raise SystemExit(
                  f"expected exactly one sdist, found {len(sdists)}: "
                  + ", ".join(path.name for path in sdists)
              )
          names = [path.name for path in wheels + sdists]
          if len(names) != len(set(names)):
              raise SystemExit("duplicate distribution basenames detected")

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = Version(project["project"]["version"])
          normalized = str(version)
          for wheel in wheels:
              match = re.match(r"proximity_forests-([^-]+)-", wheel.name)
              if not match or Version(match.group(1)) != version:
                  raise SystemExit(f"wheel version mismatch: {wheel.name} != {normalized}")
          sdist_match = re.match(r"proximity_forests-([^.]+(?:\.[^.]+)*)\.tar\.gz$", sdists[0].name)
          if not sdist_match or Version(sdist_match.group(1)) != version:
              raise SystemExit(f"sdist version mismatch: {sdists[0].name} != {normalized}")

          tag = os.environ.get("RELEASE_TAG", "")
          if tag:
              if not tag.startswith("v") or Version(tag[1:]) != version:
                  raise SystemExit(f"tag {tag!r} does not match project version {normalized}")

          checksums = []
          for path in sorted(wheels + sdists, key=lambda item: item.name):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f"{digest}  {path.name}")
          (dist / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          print(f"verified {len(wheels)} wheels and {len(sdists)} sdist for {normalized}")
          PY
          python -m twine check dist/*.whl dist/*.tar.gz
          cat dist/SHA256SUMS
      - name: Upload publication-ready distribution bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
