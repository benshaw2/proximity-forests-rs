name: Build alpha wheels
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux-*"
          CIBW_TEST_REQUIRES: "pytest numpy>=1.23"
          CIBW_TEST_COMMAND: "python -m pytest {project}/python/tests/test_smoke.py {project}/python/tests/test_package_metadata.py {project}/python/tests/test_missing_capability_boundary.py"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
