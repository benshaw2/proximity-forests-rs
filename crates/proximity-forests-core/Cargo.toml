[package]
name = "proximity-forests-core"
description = "Rust core for Proximity Forest models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "proximity_forests_core"
path = "src/lib.rs"

[features]
default = ["parallel"]
parallel = []

[dependencies]
crc32fast = "1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]

[lints]
workspace = true
